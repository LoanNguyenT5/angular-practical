<nz-modal [(nzVisible)]="isVisible" [nzFooter]="null" (nzOnCancel)="onCancel()" [nzWidth]="600" [nzClosable]="false"
  [nzMaskClosable]="false" nzClassName="custom-modal">
  <ng-container *nzModalContent>
    <!-- Modal Header -->
    <div class="modal-header">
      <span class="modal-title">
        {{ mode === 'edit' ? 'Edit User' : 'New User' }}
      </span>
      <button class="close-button" type="button" (click)="onCancel()">×</button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <form nz-form [formGroup]="form" nzLayout="vertical" class="form-section" (ngSubmit)="submitForm()">
        <!-- General Section -->
        <div class="form-box-title">General</div>
        <div class="form-box">


          <nz-form-item>
            <nz-form-label [nzRequired]="true" nzFor="login" class="field-label">
              Login name
            </nz-form-label>
            <nz-form-control>
              <input nz-input id="login" formControlName="login" class="short-input" [readonly]="mode === 'edit'" />
              <div class="error" *ngIf="form.get('login')?.hasError('required') && form.get('login')?.touched">
                Login name is required
              </div>
              <div class="error" *ngIf="form.get('login')?.hasError('duplicate') && form.get('login')?.touched">
                Login name already exists
              </div>
            </nz-form-control>
          </nz-form-item>
        </div>


        <!-- Profile Section -->
        <div class="section-container">
          <div class="section-title">Profile</div>
          <div class="form-box">
            <div class="form-field" nz-form-item>
              <label class="field-label">Select profile template</label>
              <nz-select formControlName="template" nzPlaceHolder="Select profile template" style="width: 100%;"
                [nzDropdownStyle]="{ width: '100%' }">
                <nz-option nzValue="template1" nzLabel="Template 1"></nz-option>
                <nz-option nzValue="template2" nzLabel="Template 2"></nz-option>
              </nz-select>
              <div class="error" *ngIf="form.get('template')?.invalid && form.get('template')?.touched">
                Profile template is required
              </div>

            </div>

            <!-- Custom user profile checkbox -->
            <div class="checkbox-field">
              <label nz-checkbox formControlName="customProfile">Custom user profile</label>
            </div>

            <!-- Roles Section -->
            <div class="roles-section">
              <div class="roles-label">ROLES</div>
              <div class="roles-container">
                <label nz-checkbox formControlName="roleMaster">Master</label>
                <label nz-checkbox formControlName="roleAdmin">GlobalAdmin</label>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button nz-button type="button" (click)="onCancel()">Close</button>
      <button nz-button nzType="primary" [disabled]="form.invalid" (click)="submitForm()">Save</button>
    </div>
  </ng-container>
</nz-modal>
